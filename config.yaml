# Microplastic Transport Prediction System

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  external_dir: data/external

general:
  project_name: microplastic-transport-gnn
  version: 1.0.0
  description: "Spatiotemporal GNN for predicting microplastic concentrations in river networks"
  seeds: [42, 123, 456, 789, 101]
  n_ensemble_members: 5

study_region:
  primary_watershed: Delaware River Basin
  geographic_bounds:
    min_lat: 39.5
    max_lat: 42.5
    min_lon: -75.5
    max_lon: -74.0
  epsg: 4326
  projected_epsg: 2228

feature_engineering:
  temporal_window_size: 7
  lag_features: [1, 3, 7]
  max_gap_interpolate_days: 7

model:
  model_type: graphsage_gru
  hidden_dim: 64
  num_gnn_layers: 2
  num_rnn_layers: 1
  dropout: 0.3
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 32
  max_epochs: 500
  early_stopping_patience: 30
  gradient_clip: 5.0
  sequence_length: 7

training:
  validation_split: 0.15
  use_amp: false
  device: auto

graph:
  graph_type: river_connectivity
  edge_weight_method: flow_accumulation
  min_edge_weight: 0.01
  node_definition: river_segment
  max_nodes: 1000

data_quality:
  min_microplastic_observations: 100
  min_obs_per_location: 3
  max_outlier_std: 5.0

experiments:
  results_dir: experiments/results
  checkpoints_dir: experiments/checkpoints
  logs_dir: experiments/logs

paths:
  figures_dir: figures
  tables_dir: tables
